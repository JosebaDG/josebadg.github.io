<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Lente gravitacional en WebGL2 · Laboratorio</title>
  <link rel="icon" type="image/svg+xml" href="/portada/marca/favicon.svg">
  <link rel="stylesheet" href="lente.css">
</head>
<body>
  <!--
    Lente gravitacional en WebGL2 (Charlie, laboratorio de animación y vídeo; paso 2 de la ruta).
    Basado en pdoom-video de Giacomo Magnanini (github.com/mexicat/pdoom-video), MIT.
    Un fotograma por enlace: ?t=0.8&r=3.2 (t de 0 a 1, r = segundos del reloj)
    &mm=1 → menos movimiento · &nivel=0|1|2 → nivel fijo · &ui=0 → sin controles, para capturas.
    No toca /motor/ ni la portada.
  -->
  <canvas class="lienzo" id="lienzo" aria-hidden="true"></canvas>
  <p class="cartel" id="cartel" hidden>Este navegador no tiene WebGL 2, así que la lente no se puede pintar aquí.</p>

  <main class="panel" id="panel">
    <h1 class="titulo">Lente gravitacional <a href="/lab/#experimentos">Laboratorio</a></h1>

    <div class="fila">
      <label for="t">Masa (t) <output id="tSale" for="t">0,000</output></label>
      <input id="t" type="range" min="0" max="1" step="0.001" value="0.85">
    </div>

    <div class="fila">
      <label for="r">Reloj <output id="rSale" for="r">0,00 s</output></label>
      <input id="r" type="range" min="0" max="14" step="0.01" value="0">
    </div>

    <div class="fila">
      <label for="nivel">Nivel</label>
      <select id="nivel">
        <option value="auto">Automático (baja si va lento)</option>
        <option value="2">2: escritorio</option>
        <option value="1">1: móvil</option>
        <option value="0">0: mínimo</option>
      </select>
    </div>

    <div class="botones">
      <button type="button" id="marcha" aria-pressed="false">Mover reloj</button>
      <label class="casilla"><input type="checkbox" id="mm"> Menos movimiento</label>
      <button type="button" id="medirBoton">Medir</button>
      <button type="button" id="copiar">Copiar enlace</button>
      <button type="button" id="ocultar" aria-label="Ocultar controles">Ocultar</button>
    </div>

    <p class="estado" id="estado" role="status" aria-live="polite"></p>
    <p class="credito">Basado en <a href="https://github.com/mexicat/pdoom-video">pdoom-video</a>, de Giacomo Magnanini (MIT). <a href="hoja.jpg">Hoja de contacto</a>.</p>
  </main>

  <button type="button" class="mostrar" id="mostrar" hidden>Controles</button>

  <script type="module" src="pagina.js"></script>
</body>
</html>
